name: Deploy

on:
  push:
    branches: [dev, main]

jobs:
  deploy-server:
    name: Deploy API Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy server (staging)
        if: github.ref == 'refs/heads/dev'
        run: railway up --service fitapp-server --detach
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Deploy server (production)
        if: github.ref == 'refs/heads/main'
        run: railway up --service fitapp-server --detach
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

  seed-db:
    name: Seed Database (exercises + routines)
    needs: deploy-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Wait for server to apply migrations
        run: sleep 60
      - name: Run migrations (staging)
        if: github.ref == 'refs/heads/dev'
        run: railway run --service fitapp-server -- npx prisma migrate deploy
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Seed exercises + routines (staging)
        if: github.ref == 'refs/heads/dev'
        run: railway run --service fitapp-server -- npx tsx prisma/seed.ts
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Run migrations (production)
        if: github.ref == 'refs/heads/main'
        run: railway run --service fitapp-server -- npx prisma migrate deploy
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Seed exercises + routines (production)
        if: github.ref == 'refs/heads/main'
        run: railway run --service fitapp-server -- npx tsx prisma/seed.ts
        working-directory: server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

  deploy-web:
    name: Deploy Web Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy web (staging)
        if: github.ref == 'refs/heads/dev'
        run: railway up --service fitapp-web --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      - name: Deploy web (production)
        if: github.ref == 'refs/heads/main'
        run: railway up --service fitapp-web --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
