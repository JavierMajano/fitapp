name: Deploy

on:
  push:
    branches:
      - dev     # → staging
      - main    # → production

jobs:
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefix server

      - name: Run DB migrations
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.DATABASE_URL_PROD || secrets.DATABASE_URL_STAGING }}

      - name: Deploy to Railway (staging)
        if: github.ref == 'refs/heads/dev'
        run: npx @railway/cli up --service fitapp-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Deploy to Railway (production)
        if: github.ref == 'refs/heads/main'
        run: npx @railway/cli up --service fitapp-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: failure()
    steps:
      - name: Post to Slack
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"Deploy failed on branch ${{ github.ref_name }} — check GitHub Actions."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
