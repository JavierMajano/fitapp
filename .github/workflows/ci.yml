name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  server-typecheck:
    name: Server Typecheck
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Server lint
        run: npm run lint
        working-directory: server

      - name: Server TypeScript check
        run: npm run typecheck
        working-directory: server

  expo-doctor:
    name: Expo Doctor
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor

  playwright:
    name: Playwright E2E (Desktop + Mobile)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Expo web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000

      - name: Serve static build
        run: npx serve@latest dist -p 8081 --single &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081 > /dev/null 2>&1 && echo "Ready" && exit 0
            echo "Waiting ($i/30)…"; sleep 2
          done
          echo "Server timeout" && exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  playwright-regression:
    name: Playwright Regression (full backend)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # Only runs on direct pushes to dev or main — not on every PR
    if: github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Expo web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000

      - name: Start backend server
        run: node -r dotenv/config src/index.js &
        working-directory: server
        env:
          PORT: 3000

      - name: Serve static Expo build
        run: npx serve@latest dist -p 8081 --single &

      - name: Wait for both servers
        run: |
          for i in $(seq 1 30); do
            api=$(curl -sf http://localhost:3000/trpc/health 2>/dev/null && echo ok || echo "")
            web=$(curl -sf http://localhost:8081 2>/dev/null && echo ok || echo "")
            [ -n "$api" ] && [ -n "$web" ] && echo "Both servers ready" && exit 0
            echo "Waiting ($i/30)…"; sleep 3
          done
          echo "Server timeout" && exit 1

      - name: Run regression E2E suite
        run: npm run test:e2e:regression
        env:
          E2E_URL: http://localhost:8081
          E2E_API_URL: http://localhost:3000

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: playwright-report/
          retention-days: 30
