[variables]
# Railpack auto-detects @sentry/node and generates a Docker build secret named "sentry".
# Providing defaults here prevents the build from failing when these aren't provided as build secrets.
SENTRY_DSN = ""
sentry = ""
# google-auth-library also triggers a build secret; default to empty to prevent build failures.
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
google = ""
